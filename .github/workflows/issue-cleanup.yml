name: Issue Weekly Cleanup

on:
  schedule:
    # 每周一 UTC 00:00 = 北京时间 08:00
    - cron: '0 0 * * 0'
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 获取所有 open issues
        id: list-issues
        run: |
          gh issue list --state open --json number,title \
            --jq '.[] | "\(.number)|\(.title)"' > issues.txt
          echo "共 $(wc -l < issues.txt) 个 open issues"

      - name: 遍历 issue 检查评论并关闭
        id: process-issues
        run: |
          new_rows=""
          first=true

          while IFS='|' read -r number title; do
            [ -z "$number" ] && continue
            echo "检查 Issue #$number: $title"

            comments=$(gh api "/repos/${{ github.repository }}/issues/$number/comments" \
              --jq '.[].body')

            if echo "$comments" | grep -q '✅'; then
              echo "✅ Issue #$number 成功，关闭中..."
              gh issue close "$number" --reason completed

              address=$(echo "$comments" | grep '✅' | sed 's/.*镜像地址： *//' | head -1)

              if [ -n "$address" ]; then
                echo "  镜像地址: $address"
                if [ "$first" = true ]; then
                  new_rows="$title|$address"
                  first=false
                else
                  new_rows="$new_rows"$'\n'"$title|$address"
                fi
              fi
            else
              echo "  Issue #$number 无成功标记，跳过"
            fi
          done < issues.txt

          if [ -z "$new_rows" ]; then
            touch new_rows.txt.empty
          else
            printf '%s\n' "$new_rows" > new_rows.txt
          fi

      - name: 更新 README
        run: |
          if [ -f new_rows.txt.empty ]; then
            echo "没有新的成功镜像需要记录"
            exit 0
          fi

          if ! grep -q '^## 已同步镜像' README.md; then
            echo "" >> README.md
            echo "---" >> README.md
            echo "" >> README.md
            echo "## 已同步镜像" >> README.md
            echo "" >> README.md
            echo "| 镜像 | 阿里云地址 |" >> README.md
            echo "|------|-----------|" >> README.md
          fi

          while IFS='|' read -r image address; do
            [ -z "$image" ] && continue
            if grep -q "| $image |" README.md; then
              echo "镜像 $image 已存在，跳过"
              continue
            fi
            echo "| $image | \`$address\` |" >> README.md
            echo "添加记录: $image -> $address"
          done < new_rows.txt

      - name: 提交 README 变更
        run: |
          if git diff --quiet README.md; then
            echo "README.md 无变更"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: 更新已同步镜像列表"
          git push
