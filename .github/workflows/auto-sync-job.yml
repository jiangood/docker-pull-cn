name: Docker Image Sync

env:
  sys.registry.pwd: ${{ secrets.REGISTRY_PWD }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  issue_comment:
    types: [created]

jobs:
  sync:
    if: >-
      contains(github.event.issue.labels.*.name, 'image-sync') &&
      startsWith(github.event.comment.body, '/pull ') &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
    - name: 解析镜像名
      id: params
      env:
        COMMENT_BODY: ${{ github.event.comment.body }}
      run: |
        raw="$(printf '%s\n' "$COMMENT_BODY" | sed -n '1p')"
        command="$(printf '%s' "$raw" | xargs)"
        image="$(printf '%s\n' "$COMMENT_BODY" | sed -n '1{s|^/pull[[:space:]]*||;p;}')"
        image="$(printf '%s' "$image" | xargs)"

        # 先写出原始评论，即使校验失败也能引用到用户的操作
        echo "command=$command" >> "$GITHUB_OUTPUT"

        if [ -z "$image" ]; then
          echo "::error::未提供镜像名，格式：/pull python:3.12"
          exit 1
        fi
        if [[ "$image" != *:* ]]; then
          echo "::error::镜像名必须包含 tag，例如：/pull python:3.12"
          exit 1
        fi

        echo "image=$image" >> "$GITHUB_OUTPUT"

    - name: 发布进行中评论
      id: start
      env:
        COMMAND: ${{ steps.params.outputs.command }}
        REQUESTER: ${{ github.event.comment.user.login }}
      run: |
        {
          quote="$(printf '%s' "$COMMAND" | sed 's/`/\\`/g; s/@/\&#64;/g')"
          printf '> %s\n\n' "$quote"
          echo "🤖 **镜像同步｜⏳ 进行中**"
          echo
          echo "收到 @$REQUESTER 的请求，完成后会更新这条评论，请稍候…"
        } > start.md

        comment_id="$(gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" -F body=@start.md --jq .id)"
        echo "comment_id=$comment_id" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v4

    - name: 执行同步
      id: sync
      env:
        IMAGE: ${{ steps.params.outputs.image }}
      run: python sync.py "$IMAGE"

    - name: 更新评论为结果
      if: always()
      env:
        MSG: ${{ steps.sync.outputs.msg }}
        COMMAND: ${{ steps.params.outputs.command }}
        COMMENT_ID: ${{ steps.start.outputs.comment_id }}
      run: |
        {
          if [ -n "$COMMAND" ]; then
            quote="$(printf '%s' "$COMMAND" | sed 's/`/\\`/g; s/@/\&#64;/g')"
            printf '> %s\n\n' "$quote"
          fi
          if [ -n "$MSG" ]; then
            echo "$MSG"
          elif [ -n "$COMMENT_ID" ]; then
            echo "🤖 **镜像同步｜❌ 失败**"
            echo
            echo "同步过程中出现了意外错误，请稍后重试，或查看 Actions 日志。"
          else
            echo "🤖 **镜像同步｜❌ 没能开始**"
            echo
            echo "请确认评论格式是 \`/pull 镜像名:tag\`，例如 \`/pull python:3.12\`。"
            echo "如果格式没问题，可能是网络或镜像仓库暂时不可用，请稍后重试。"
          fi
        } > comment.md

        if [ -n "$COMMENT_ID" ]; then
          gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -F body=@comment.md > /dev/null
        else
          gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" -F body=@comment.md > /dev/null
        fi
