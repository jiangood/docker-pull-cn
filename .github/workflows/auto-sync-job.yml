name: Docker Image Sync

env:
  sys.registry.pwd: ${{ secrets.REGISTRY_PWD }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GHCR_REPO: ${{ github.repository }}

on:
  issues:
    types: [opened]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      packages: write
      contents: write

    steps:
    - name: 检查标题是否包含冒号
      if: contains(github.event.issue.title, ':')
      run: echo "Issue 标题中包含冒号，继续执行"

    - name: 回复issue开始
      run: gh issue comment ${{ github.event.issue.number }} --body "🤖 任务已收到，正在执行中..." --repo ${{ github.repository }}

    - uses: actions/checkout@v4

    - name: 执行同步
      id: sync
      run: python sync.py "${{ github.event.issue.title }}"

    - name: 更新README
      if: success()
      run: python sync.py --update-readme

    - name: Debug ghcr auth
      if: success()
      run: |
        echo "=== 1. 匿名请求 tags/list ==="
        curl -s -i -o /dev/null -w "HTTP %{http_code}\n" https://ghcr.io/v2/jiangood/docker-pull-cn/tags/list
        echo "=== 2. 匿名 WWW-Authenticate ==="
        curl -s -D - -o /dev/null https://ghcr.io/v2/jiangood/docker-pull-cn/tags/list | grep -i "www-authenticate"
        echo "=== 3. 用 token 交换 ==="
        curl -s "https://ghcr.io/token?service=ghcr.io&scope=repository:jiangood/docker-pull-cn:pull" -u "token:$GITHUB_TOKEN" | head -c 200
        echo ""
        echo "=== 4. 用交换的 token 请求 ==="
        TOK=$(curl -s "https://ghcr.io/token?service=ghcr.io&scope=repository:jiangood/docker-pull-cn:pull" -u "token:$GITHUB_TOKEN" | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
        curl -s -w "\nHTTP %{http_code}\n" -H "Authorization: Bearer $TOK" https://ghcr.io/v2/jiangood/docker-pull-cn/tags/list

    - name: 提交README变更
      if: success()
      run: |
        if git diff --quiet README.md; then
          echo "README.md 无变更"
        else
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: 自动更新已同步镜像列表"
          git push
        fi

    - name: 回复issue完成
      if: always()
      run: gh issue comment ${{ github.event.issue.number }} --body "${{ steps.sync.outputs.msg }}" --repo ${{ github.repository }}

    - name: 关闭issue
      if: success()
      run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
