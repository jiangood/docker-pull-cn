name: Docker Image Sync

env:
  sys.registry.pwd: ${{ secrets.REGISTRY_PWD }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  issue_comment:
    types: [created]

jobs:
  sync:
    if: >-
      contains(github.event.issue.labels.*.name, 'image-sync') &&
      startsWith(github.event.comment.body, '/pull ') &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
    - name: 解析镜像名
      id: params
      env:
        COMMENT_BODY: ${{ github.event.comment.body }}
      run: |
        image="$(printf '%s\n' "$COMMENT_BODY" | sed -n '1{s|^/pull[[:space:]]*||;p;}')"
        image="$(printf '%s' "$image" | xargs)"

        if [ -z "$image" ]; then
          echo "::error::未提供镜像名，格式：/pull python:3.12"
          exit 1
        fi
        if [[ "$image" != *:* ]]; then
          echo "::error::镜像名必须包含 tag，例如：/pull python:3.12"
          exit 1
        fi

        echo "image=$image" >> "$GITHUB_OUTPUT"
        echo "开始同步: $image"

    - name: 回复issue开始
      env:
        IMAGE: ${{ steps.params.outputs.image }}
      run: gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "🤖 收到，开始同步 \`$IMAGE\` ..."

    - uses: actions/checkout@v4

    - name: 执行同步
      id: sync
      env:
        IMAGE: ${{ steps.params.outputs.image }}
      run: python sync.py "$IMAGE"

    - name: 回复结果
      if: always()
      env:
        MSG: ${{ steps.sync.outputs.msg }}
        IMAGE: ${{ steps.params.outputs.image }}
      run: |
        {
          echo "### \`$IMAGE\`"
          echo
          echo "${MSG:-❌ 任务失败，镜像名可能无效，请查看 Actions 日志。}"
        } > comment.md
        gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file comment.md
